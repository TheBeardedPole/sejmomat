{# Sub-navigation shared by the amendment pages. `here`: "all", "adopted" or a proposer name. #}
<nav class="subnav">
  <a href="{{ root }}poprawki.html"{% if here == "all" %} class="current"{% endif %}>{{ _("Wszystkie poprawki") }}</a>
  <a href="{{ root }}skuteczne-poprawki.html"{% if here == "adopted" %} class="current"{% endif %}>{{ _("Skuteczne poprawki") }}</a>
  {% for p in proposers %}{% if p.voted >= 5 %}
  <a href="{{ root }}poprawki/{{ club_slug(p.name) }}.html"{% if here == p.name %} class="current"{% endif %}>{{ p.name | who }}</a>
  {% endif %}{% endfor %}
</nav>
