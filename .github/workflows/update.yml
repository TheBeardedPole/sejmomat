name: Aktualizacja danych i publikacja

on:
  schedule:
    - cron: "0 22 * * *"   # after evening voting blocks
    - cron: "30 5 * * *"   # catch late corrections
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # Scheduled runs only do work on Sejm sitting days and two days after;
  # a manual run always goes ahead.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sejmomat
      - id: day
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(python3 -m sejmomat.sitting_days)" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install poppler (pdftotext) and Tesseract (OCR for scanned prints)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-pol

      - run: pip install -r requirements.txt

      # Consolidated texts of amended acts are large and not committed;
      # keep them between runs so only newly cited acts are downloaded.
      - uses: actions/cache@v4
        with:
          path: cache/acts
          key: acts-${{ github.run_id }}
          restore-keys: acts-

      - name: Fetch new votings, prints and amended acts
        run: python -m sejmomat fetch
        env:
          ACTS_PER_RUN: "400"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja danych $(date -u +%F)"
            git push
          fi

      - name: Build site
        run: python -m sejmomat build
        env:
          # Public address ("https://example.pl/"), for canonical links,
          # hreflang and sitemap.xml. Set as a repository variable.
          SITE_URL: ${{ vars.SITE_URL }}

      # Index the Polish pages only: the English ones repeat the same legal
      # text, and every indexed page becomes one more file to upload. Search
      # on English pages falls back to the Polish index.
      - name: Build search index
        run: |
          mv site/en "$RUNNER_TEMP/site-en"
          npx -y pagefind@1 --site site
          mv "$RUNNER_TEMP/site-en" site/en

      # Upload over SSH with rsync: one connection, compressed, and only
      # files whose content changed are sent (--checksum, because every build
      # gives all files a new date). Files no longer in the build are removed.
      - name: Deploy over SSH (rsync)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_DIR: ${{ vars.SSH_DIR }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          source .github/ssh-setup.sh
          rsync --recursive --links --checksum --compress --delete --delete-after \
            --exclude '.well-known/' --stats --human-readable \
            -e "$RSYNC_SSH" site/ "$SSH_TARGET:$SSH_DIR"
