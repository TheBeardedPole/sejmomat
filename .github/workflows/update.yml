name: Aktualizacja danych i publikacja

on:
  schedule:
    - cron: "0 22 * * *"   # after evening voting blocks
    - cron: "30 5 * * *"   # catch late corrections
  workflow_dispatch:
    inputs:
      fetch:
        description: "Pobrać nowe dane z Sejmu (wyłącz, gdy zmienił się tylko wygląd lub treść stron)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # Scheduled runs only do work on Sejm sitting days and two days after,
  # and not before PAUSE_SCHEDULED_UNTIL if set; a manual run always goes ahead.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sejmomat
      - id: day
        env:
          # Optional repository variable (YYYY-MM-DD): no scheduled runs before that day.
          PAUSE_SCHEDULED_UNTIL: ${{ vars.PAUSE_SCHEDULED_UNTIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(python3 -m sejmomat.sitting_days)" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install poppler (pdftotext), Tesseract (OCR for scanned prints) and a font (summary images)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-pol fonts-noto-core

      - run: pip install -r requirements.txt

      # A manual run with "fetch" off only rebuilds and uploads the pages.
      - name: Fetch new votings, prints and amended acts
        if: github.event_name != 'workflow_dispatch' || inputs.fetch
        run: python -m sejmomat fetch

      - name: Commit updated data
        if: github.event_name != 'workflow_dispatch' || inputs.fetch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja danych $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"   # main may have moved since checkout
            git push
          fi

      - name: Build site
        run: python -m sejmomat build
        env:
          # Public address ("https://example.pl/"), for canonical links,
          # hreflang and sitemap.xml. Set as a repository variable.
          SITE_URL: ${{ vars.SITE_URL }}
          # Google Analytics 4 measurement id ("G-..."); unset, the site has no analytics.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      # Index the Polish pages only: the English ones repeat the same legal
      # text, and every indexed page becomes one more file to upload. Search
      # on English pages falls back to the Polish index.
      - name: Build search index
        run: |
          mv site/en "$RUNNER_TEMP/site-en"
          npx -y pagefind@1 --site site
          mv "$RUNNER_TEMP/site-en" site/en

      # Upload over SSH with rsync: one connection, compressed, and only
      # files whose content changed are sent (--checksum, because every build
      # gives all files a new date). Files no longer in the build are removed.
      - name: Deploy over SSH (rsync)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
          SSH_DIR: ${{ vars.SSH_DIR }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          source .github/ssh-setup.sh
          # Comparing ~30,000 files by checksum keeps the shared server's disk busy,
          # and visitors got slow pages and 504s meanwhile: the server side of rsync
          # runs at the lowest CPU and disk priority (ionice where the host has it).
          if $RSYNC_SSH "$SSH_TARGET" 'command -v ionice' >/dev/null 2>&1; then
            remote_rsync="ionice -c3 nice -n 19 rsync"
          else
            remote_rsync="nice -n 19 rsync"
          fi
          echo "remote rsync: $remote_rsync"
          # the host's SSH sometimes times out for a while: try three times, a minute apart
          for attempt in 1 2 3; do
            rsync --rsync-path="$remote_rsync" --recursive --links --checksum --compress --delete --delete-after \
              --exclude '.well-known/' --exclude 'srv/data/' --stats --human-readable \
              -e "$RSYNC_SSH" site/ "$SSH_TARGET:$SSH_DIR" && exit 0
            echo "upload attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1
