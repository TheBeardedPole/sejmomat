name: Aktualizacja danych i publikacja

on:
  schedule:
    - cron: "0 22 * * *"   # after evening voting blocks
    - cron: "30 5 * * *"   # catch late corrections
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install poppler (pdftotext) and Tesseract (OCR for scanned prints)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-pol

      - run: pip install -r requirements.txt

      # Consolidated texts of amended acts are large and not committed;
      # keep them between runs so only newly cited acts are downloaded.
      - uses: actions/cache@v4
        with:
          path: cache/acts
          key: acts-${{ github.run_id }}
          restore-keys: acts-

      - name: Fetch new votings, prints and amended acts
        run: python -m sejmomat fetch
        env:
          ACTS_PER_RUN: "150"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja danych $(date -u +%F)"
            git push
          fi

      - name: Build site
        run: python -m sejmomat build
        env:
          # Public address ("https://example.pl/"), for canonical links,
          # hreflang and sitemap.xml. Set as a repository variable.
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Build search index
        run: npx -y pagefind@1 --site site

      # Upload to the web host. A state file on the server records file
      # hashes, so only changed files are sent on each run.
      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
