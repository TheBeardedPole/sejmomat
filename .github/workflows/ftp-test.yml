name: Test logowania FTP

# Quick check of the FTP_* secrets without fetching or building anything:
# logs in and lists the target directory.
on:
  workflow_dispatch:

permissions: {}

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Log in and list the target directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'public_html/' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        run: |
          # Report shape problems that commonly cause "530 Login incorrect",
          # without revealing the values.
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            value="${!name}"
            echo "$name: ${#value} characters"
            case "$value" in
              *[[:space:]]*) echo "::warning::$name contains whitespace (space or line break)";;
            esac
          done
          case "$FTP_SERVER" in *://*) echo "::warning::FTP_SERVER should not include ftp:// or a path";; esac
          set -o pipefail
          tls=()
          # Encrypted, but without checking the certificate's host name: the
          # server is addressed by IP (the deploy action does the same).
          if [ "$FTP_PROTOCOL" != "ftp" ]; then tls=(--ssl-reqd --insecure); fi
          # Which of the usual web roots exist for this account? Only the
          # outcome is printed: these logs are public.
          ok=1
          for dir in "" "$FTP_DIR" "public_html/" "domains/sejmomat.pl/public_html/"; do
            if curl --silent --show-error --max-time 60 "${tls[@]}" --list-only \
                 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$dir" > listing.txt 2> err.txt; then
              echo "OK   '/$dir' exists ($(wc -l < listing.txt) entries;" \
                   "contains public_html: $(grep -qx 'public_html' listing.txt && echo yes || echo no)," \
                   "contains index/default page: $(grep -Eqx '(index|default)\.(html|php)' listing.txt && echo yes || echo no))"
              ok=0
            else
              echo "FAIL '/$dir': $(cat err.txt)"
            fi
          done
          rm -f listing.txt err.txt
          exit $ok
